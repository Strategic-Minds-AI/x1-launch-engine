name: Florida legal preview validation
on:
  pull_request:
    paths:
      - 'sitepacks/florida-legal-study/**'
      - 'tools/*legal-study.mjs'
      - 'tests/legal-study.test.mjs'
      - 'Dockerfile.legal-preview'
      - '.dockerignore'
      - '.github/workflows/legal-preview-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - name: Syntax, behavioral and neighboring portal contracts
        run: |
          node --check tools/build-legal-study.mjs
          node --check tools/serve-legal-study.mjs
          node --check sitepacks/florida-legal-study/study.js
          node --test tests/*.test.mjs
      - name: Build immutable noindex artifact and container
        env:
          X1_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/build-legal-study.mjs sitepacks/florida-legal-study/mission.json work/legal-dist
          docker build --build-arg X1_SOURCE_SHA="$X1_SOURCE_SHA" -f Dockerfile.legal-preview -t x1-legal-preview:ci .
      - name: Verify container startup and intake rejection
        run: |
          trap 'docker rm -f x1-legal-preview-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name x1-legal-preview-ci --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 128m -p 127.0.0.1:18080:8080 x1-legal-preview:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/healthz
          curl --fail -I http://127.0.0.1:18080/ | grep -i 'x-robots-tag: noindex'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/legal-intake)" = 503
