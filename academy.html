</style></head><body><header><strong>X1 / ORIGINAL UNIVERSAL FACTORY ACADEMY</strong><div><a href="/admin.html">← Admin dashboard</a> · <a id="openSource" href="https://universal-factory-academy.vercel.app/studio/" target="_blank" rel="noopener noreferrer">Open original Studio ↗</a></div></header><nav class="nav" aria-label="Industry academies" id="nav"></nav><div class="fallback">Source: original Universal Factory Academy · 40 master layouts and 36 industry demonstrations. Original Studio export technology; client project persistence remains a separate integration.</div><section class="embed"><iframe id="factory" title="Original Universal Factory Academy Studio" referrerpolicy="strict-origin-when-cross-origin" loading="eager"></iframe></section><script>
const base='https://universal-factory-academy.vercel.app';
const views=[['Studio','/studio/'],['All academies','/academies/'],['Epoxy','/academies/epoxy/'],['Legal','/academies/legal/'],['Real Estate','/academies/real-estate/'],['Equipment','/academies/equipment/'],['Training','/academies/training/'],['AI Systems','/academies/ai-systems/']];
