<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>X1 Client Workspace</title>
<style>:root{font-family:Inter,system-ui,sans-serif;background:#061b30;color:#eff7ff}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;border-bottom:1px solid #25506d;display:flex;justify-content:space-between;gap:15px;align-items:center}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.04em}main{max-width:1140px;margin:auto;padding:36px 5%}section{background:#0c2946;border:1px solid #34556f;padding:28px;border-radius:15px;margin:18px 0}label{font-size:14px;font-weight:700;display:block;margin:13px 0}input,select,textarea{display:block;width:100%;padding:13px;background:#092039;border:1px solid #54718a;border-radius:9px;color:white;margin-top:7px;font:inherit}button{background:#1684ee;color:white;padding:13px 17px;font:inherit;font-weight:800;border:0;border-radius:9px;cursor:pointer;margin:6px 8px 6px 0}button.secondary{background:#274967}button:focus-visible,a:focus-visible{outline:3px solid #71d8ff;outline-offset:3px}a{color:#8bd1ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.site{border:1px solid #3d6281;border-radius:12px;padding:18px;background:#123759}.site h3{margin:5px 0}.site small{color:#afc9e3}#message{color:#b4e0ff;min-height:25px}.hidden{display:none!important}</style></head><body>
<header><strong>X1 WEBSITE LAUNCH ENGINE</strong><nav><a href="/">Website</a> · <a href="/designer.html">Template Designer</a> <button id="logout" class="secondary hidden">Sign out</button></nav></header>
<main><h1>Client Workspace</h1><p id="message" role="status" aria-live="polite">Connecting to authentication…</p>
<section id="auth" class="hidden"><h2>Sign in or create account</h2><form id="authForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button type="submit">Sign in</button><button id="signup" type="button" class="secondary">Create account</button></form></section>
<div id="workspace" class="hidden"><section><h2>New website</h2><form id="siteForm"><div class="grid"><label>Business name<input id="businessName" maxlength="180" required></label><label>Industry<select id="industry"><option>Legal</option><option>Epoxy flooring</option><option>Concrete coatings</option><option>HVAC</option><option>Roofing</option><option>Plumbing</option><option>Electrical</option><option>Restoration</option><option>Real estate</option><option>Other services</option></select></label><label>City / service area<input id="city" maxlength="180"></label></div><button type="submit">Create website project</button></form></section>
<section><h2>My website projects</h2><div id="sites" class="grid"></div></section></div></main>
<script type="module">
const $=id=>document.getElementById(id),message=text=>$('message').textContent=text;
let api,token,user;
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function request(path,method='GET',body){let r=await fetch(api.url+'/rest/v1/'+path,{method,headers:{apikey:api.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error((await r.text()).slice(0,220));return r.status===204?[]:r.json();}
async function auth(endpoint,body){let r=await fetch(api.url+'/auth/v1/'+endpoint,{method:'POST',headers:{apikey:api.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Authentication failed');return j;}
async function session(access){let r=await fetch(api.url+'/auth/v1/user',{headers:{apikey:api.anonKey,Authorization:'Bearer '+access}});if(!r.ok)throw Error('Session expired');let u=await r.json();token=access;user=u;localStorage.setItem('x1_access_token',access);$('auth').classList.add('hidden');$('workspace').classList.remove('hidden');$('logout').classList.remove('hidden');message('Signed in as '+u.email);await load();}
async function load(){try{const rows=await request('wle_sites?select=id,business_name,industry,city,status,created_at&order=created_at.desc');$('sites').innerHTML=rows.length?rows.map(s=>'<article class="site"><small>'+escape(s.industry)+' • '+escape(s.status)+'</small><h3>'+escape(s.business_name)+'</h3><p>'+escape(s.city)+'</p><button type="button" data-site="'+escape(s.id)+'">Request review</button></article>').join(''):'<p>No projects yet. Create your first website above.</p>';}catch(e){message('Could not load sites: '+e.message)}}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await auth('token?grant_type=password',{email:$('email').value,password:$('password').value});await session(r.access_token)}catch(e){message(e.message)}});
$('signup').onclick=async()=>{try{const r=await auth('signup',{email:$('email').value,password:$('password').value});if(r.access_token)await session(r.access_token);else message('Account created. Check email for verification.')}catch(e){message(e.message)}};
$('logout').onclick=async()=>{if(token)await fetch(api.url+'/auth/v1/logout',{method:'POST',headers:{apikey:api.anonKey,Authorization:'Bearer '+token}}).catch(()=>{});localStorage.removeItem('x1_access_token');location.reload()};
$('siteForm').addEventListener('submit',async e=>{e.preventDefault();try{await request('wle_sites','POST',{owner_id:user.id,business_name:$('businessName').value.trim(),industry:$('industry').value,city:$('city').value.trim()});$('siteForm').reset();message('Website project created.');await load()}catch(e){message('Could not create project: '+e.message)}});
$('sites').addEventListener('click',async e=>{const id=e.target.getAttribute('data-site');if(!id)return;try{await request('wle_site_approvals','POST',{site_id:id,requester_id:user.id,revision:'initial',status:'pending'});message('Review request recorded.')}catch(err){message('Review request failed: '+err.message)}});
try{const r=await fetch('/api/config',{cache:'no-store'});api=await r.json();if(!r.ok||!api.ready)throw Error(api.error||'Provider unavailable');$('auth').classList.remove('hidden');message('Sign in to manage your projects.');const saved=localStorage.getItem('x1_access_token');if(saved){try{await session(saved)}catch{localStorage.removeItem('x1_access_token')}}}catch(e){message('Workspace unavailable: '+e.message)}
</script></body></html>
